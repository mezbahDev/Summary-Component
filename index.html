<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Order summary card</title>
</head>
<body>
  <div class="class-container">
    <img src="/images/illustration-hero.svg" alt="" class="class-container_heroImg"/>
    <div class="class-container_body-section">
      <div class="class-container_body-section_head-section">
        <p class="class-container_body-section_head-section_text1">Order Summary</p>
        <p class="class-container_body-section_head-section_text2">You can now listen to millions of songs, audiobooks, and podcasts on any 
          device anywhere you like!</p>
      </div>
      <div class="class-container_body-section_plan-section">
        <div class="class-container_body-section_plan-section_left-section">
          <img src="images/icon-music.svg" alt=""/>
          <div class="class-container_body-section_plan-section_left-section_container">
            <p class="class-container_body-section_plan-section_left-section_container_text1">Annual Plan</p>
            <p class="class-container_body-section_plan-section_left-section_container_text2">$59.99/year</p>
          </div>
        </div>
        <a href="#" class="class-container_body-section_plan-section_change">Change</a>
      </div>
      <button class="class-container_body-section_btn">Proceed to Payment</button>
      <p class="class-container_body-section_cancelText">Cancel Order</p>
    </div>
  </div>
</body>
</html>
